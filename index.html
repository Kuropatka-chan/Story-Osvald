<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Освальд: Новелла</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ui-bg: #0f1116;
      --panel-bg: rgba(10, 12, 18, 0.8);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #82d8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1d2230, #0c0f15 55%);
      color: #e8ecf3;
      display: grid;
      place-items: center;
    }

    .game-shell {
      width: min(1080px, 100vw);
      height: min(720px, 100vh);
      background: var(--ui-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .stage {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: background-image 0.5s ease;
    }

    .stage::after {
      content: attr(data-background);
      position: absolute;
      bottom: 12px;
      right: 12px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      font-size: 12px;
      letter-spacing: 0.02em;
      border: 1px solid var(--panel-border);
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .sprite {
      position: absolute;
      bottom: 80px;
      transform: translateX(-50%);
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
      text-align: center;
    }

    .sprite img {
      width: 200px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: linear-gradient(135deg, rgba(130,216,255,0.12), rgba(255,255,255,0.04));
    }

    .sprite .label {
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      font-size: 12px;
      border: 1px solid var(--panel-border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dialogue-panel {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px 16px 18px;
      min-height: 140px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      backdrop-filter: blur(6px);
    }

    .speaker {
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .text {
      line-height: 1.5;
      font-size: 16px;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .button {
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      color: #e8ecf3;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, border 0.2s ease;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .button:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .hint {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="stage" id="stage" data-background=""></div>
    <div class="overlay" id="overlay"></div>
    <div class="hint">Space / Клик — следующий фрейм</div>
    <div class="dialogue-panel" id="dialogue">
      <div class="speaker" id="speaker"></div>
      <div class="text" id="text"></div>
      <div class="controls">
        <button class="button" id="prev">Назад</button>
        <button class="button" id="next">Вперёд</button>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
